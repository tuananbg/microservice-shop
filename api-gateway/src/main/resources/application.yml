server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true        # <-- Tự động định tuyến theo tên service từ Eureka
          lower-case-service-id: true
      routes:
        - id: product-service
          uri: lb://product-service     # dùng load balancing + tìm qua Eureka
          predicates:
            - Path=/product/**

        - id: order-services
          uri: lb://order-services
          predicates:
            - Path=/order/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  tracing:
    sampling:
      probability: 1.0  # 1.0 = trace tất cả request (có thể giảm về 0.1 ở production)
  zipkin:
    tracing:
      endpoint: http://localhost:9411  # Địa chỉ Zipkin server (port 9411)
