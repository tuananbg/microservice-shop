server:
  port: 0

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:mysql://localhost:3306/inventory_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  tracing:
    sampling:
      probability: 1.0  # 1.0 = trace tất cả request (có thể giảm về 0.1 ở production)
  zipkin:
    tracing:
      endpoint: http://localhost:9411  # Địa chỉ Zipkin server (port 9411)

springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /api-docs
